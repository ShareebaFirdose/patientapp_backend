name: 🚀 Deploy Backend to cPanel via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload files to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21

          # 👇 This must end with a slash (/) and point to your backend folder
          local-dir: predcare-backend/

          # 👇 Replace this path with your cPanel FTP target directory
          server-dir: /public_html/patientapp_backend/
