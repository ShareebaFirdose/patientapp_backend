name: 🚀 Deploy Backend to cPanel via FTP

on:
  push:
    branches:
      - main  # whenever you push to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload files to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
  server: ${{ secrets.FTP_HOST }}
  username: ${{ secrets.FTP_USERNAME }}
  password: ${{ secrets.FTP_PASSWORD }}
  port: 21
  local-dir: ./
  server-dir: /home/predsolu/patientapp_backend/

            **/node_modules/**
            **/.git/**
            **/.github/**
            .env
